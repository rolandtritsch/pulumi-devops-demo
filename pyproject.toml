[project]
name = "pulumi-devops-demo"
version = "0.1.0"
description = "Minimal AWS infrastructure for python-devops-demo"
requires-python = ">=3.13"
dependencies = ["pulumi>=3,<4", "pulumi-aws>=7,<8"]

[build-system]
requires = ["uv_build>=0.11.1,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
